[project]
name = "meta-attention"
version = "0.1.0"
description = "MetaAttention with TileLang as the default runtime backend"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "einops",
  "jinja2",
  "matplotlib",
  "ninja",
  "numpy<2",
  "sympy",
  "termcolor",
  "tilelang==0.1.15",
  "torch",
]

[project.optional-dependencies]
bench = [
  "pandas",
  "transformers==4.45.0",
]
test = [
  "pytest",
]

[tool.uv]
default-groups = []

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

# TileLang v0.1.15 is the latest released API used by the Stateful migration audit.
# Keep the source on PyPI so the lock records the release rather than an old git snapshot.
# The explicit PyTorch index remains independently controlled above.


[dependency-groups]
dev = [
  "prek>=0.4.5",
  "pytest>=9.1.1",
  "ruff>=0.15.19",
]
fla-benchmark = [
  "flash-linear-attention==0.5.2",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
exclude = [
  "3rd_parties",
  "attention_engine/core/template/cute_template",
  "attention_engine/core/template/cute_template_v2",
  "attention_engine/core/template/cute_template_kvshared",
  "attention_engine/core/template/tl_template",
]

[tool.ruff.lint.per-file-ignores]
"attention_engine/core/lower/lower.py" = ["F403", "F405"]
"attention_engine/core/lower/lower_gqa.py" = ["F403", "F405"]
"attention_engine/core/lower/lower_decode.py" = ["F403", "F405", "E402"]
"attention_engine/core/lower/lower_decode_gqa.py" = ["F403", "F405", "E402"]
"attention_engine/core/transform/core.py" = ["F403", "F405"]
"ref/flash_mla_decode_triton.py" = ["E741"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "attention_engine"

[tool.setuptools.packages.find]
where = ["attention_engine"]
include = ["attn_engine*", "core*", "autotuner*", "benchmark*"]
namespaces = true

[tool.setuptools.package-data]
core = [
  "template/**/*.py",
]
attn_engine = [
  "cache/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "unit: CPU and import-safe unit tests",
  "examples: official example factory smoke tests",
  "functional: attention correctness tests",
  "gpu: requires a CUDA or HIP GPU",
  "benchmark: long-running benchmark runner",
  "slow: long-running test",
  "h100: requires an H100-compatible CUDA runner",
  "h20: requires an NVIDIA H20 CUDA runner",
  "mi250: requires an MI250-compatible HIP runner",
  "plot: PDF plotting contract tests",
  "io: CSV and artifact I/O contract tests",
  "baseline: optional baseline integration",
]
