[project]
name = "meta-attention"
version = "0.1.0"
description = "MetaAttention with TileLang as the default runtime backend"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "einops",
  "jinja2",
  "matplotlib",
  "numpy<2",
  "sympy",
  "termcolor",
  "tilelang",
  "torch",
]

[project.optional-dependencies]
bench = [
  "flash-linear-attention==0.2.0",
  "pandas",
  "transformers==4.45.0",
]
test = [
  "pytest",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "attention_engine"

[tool.setuptools.packages.find]
where = ["attention_engine"]
include = ["attn_engine*", "core*", "autotuner*", "benchmark*"]
namespaces = true

[tool.setuptools.package-data]
core = [
  "template/**/*.py",
]
attn_engine = [
  "cache/*.py",
]

[tool.uv]
default-groups = []

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
tilelang = { git = "https://github.com/tile-ai/tilelang.git", tag = "v0.1.11" }

[dependency-groups]
dev = [
    "prek>=0.4.5",
    "pytest>=9.1.1",
    "ruff>=0.15.19",
]

[tool.ruff]
exclude = [
  "attention_engine/core/template/cute_template",
  "attention_engine/core/template/cute_template_v2",
  "attention_engine/core/template/cute_template_kvshared",
  "attention_engine/core/template/tl_template",
]

[tool.ruff.lint.per-file-ignores]
"attention_engine/core/lower/lower.py" = ["F403", "F405"]
"attention_engine/core/lower/lower_gqa.py" = ["F403", "F405"]
"attention_engine/core/lower/lower_decode.py" = ["F403", "F405", "E402"]
"attention_engine/core/lower/lower_decode_gqa.py" = ["F403", "F405", "E402"]
"attention_engine/core/transform/core.py" = ["F403", "F405"]
"ref/flash_mla_decode_triton.py" = ["E741"]
