[project]
name = "meta-attention"
version = "0.1.0"
description = "MetaAttention with TileLang as the default runtime backend"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "einops",
  "jinja2",
  "matplotlib",
  "numpy<2",
  "sympy",
  "termcolor",
  "tilelang",
  "torch",
]

[project.optional-dependencies]
bench = [
  "flash-linear-attention==0.2.0",
  "pandas",
  "transformers==4.45.0",
]
test = [
  "pytest",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "attention_engine"

[tool.setuptools.packages.find]
where = ["attention_engine"]
include = ["attn_engine*", "core*", "autotuner*", "benchmark*"]
namespaces = true

[tool.setuptools.package-data]
core = [
  "template/**/*.py",
]
attn_engine = [
  "cache/*.py",
]

[tool.uv]
default-groups = []

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
tilelang = { git = "https://github.com/tile-ai/tilelang.git", rev = "41b95a5dfafea78f200b7253c6f7527c04ee522e" }
