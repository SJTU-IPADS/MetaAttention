[project]
name = "meta-attention"
version = "0.1.0"
description = "Meta Attention"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "einops",
  "jinja2",
  "matplotlib",
  "numpy<2",
  "sympy",
  "termcolor",
]

[project.optional-dependencies]
cuda = [
  "triton==3.2.0",
  "transformers==4.45.0",
  "flash-linear-attention==0.2.0",
]
test = [
  "pytest",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "attention_engine"

[tool.setuptools.packages.find]
where = ["attention_engine"]
include = ["attn_engine*", "core*", "autotuner*", "benchmark*"]
namespaces = true

[tool.setuptools.package-data]
core = [
  "template/**/*.py",
]
attn_engine = [
  "cache/*.py",
]

[tool.uv]
default-groups = []
